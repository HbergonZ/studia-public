<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Studia · Mockups Impeccable</title>
  <link rel="stylesheet" href="styles.css">
