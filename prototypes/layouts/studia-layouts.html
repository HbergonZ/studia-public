<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Três propostas de layout para o Studia, com dados fictícios e navegação de demonstração.">
  <title>Studia | Estudo de layouts</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Manrope:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap');

:root{font-family:'Public Sans','Segoe UI',sans-serif;color:#25382f;background:#edf0ed;font-synthesis:none;font-size:14px;line-height:1.5}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button,a,input,select,textarea{outline-offset:4px}
:focus-visible{outline:3px solid #4e83b4}
button{color:inherit}
button:disabled{cursor:default;opacity:.55}
button .icon{flex-shrink:0}
button{touch-action:manipulation}
input,select,textarea{max-width:100%}
::selection{background:#d2e3d7;color:#21372b}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:600}
.icon{width:20px;height:20px;display:inline-block;vertical-align:middle;flex-shrink:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:-100px;left:20px;z-index:20;background:#fff;color:#183d64;padding:12px}
.skip-link:focus{top:8px}
.review-bar{min-height:78px;padding:14px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border-bottom:1px solid #dce1df;position:relative;z-index:3;color:#35423d}
.review-title{display:flex;gap:13px;align-items:center;white-space:nowrap;font-size:12px}
.review-title strong{font-size:17px;letter-spacing:-.6px}
.review-title span{padding-left:13px;border-left:1px solid #d7dcd9;color:#68746e}
.layout-options{display:flex;gap:4px;padding:4px;border-radius:8px;background:#f0f2f1}
.layout-options button{border:0;background:transparent;border-radius:5px;font-size:12px;font-weight:500;min-height:36px;padding:8px 17px;white-space:nowrap}
.layout-options button[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px #24382b16;color:#1d3529}
.layout-options button:hover{background:#ffffffaa}
.review-tools{display:flex;align-items:center;gap:15px;font-size:11px;white-space:nowrap}
.demo-tag{display:flex;gap:7px;align-items:center;color:#67756e}
.demo-tag:before{content:'';height:6px;width:6px;border:1px solid #81938a;border-radius:50%}
.review-about{padding:7px 0;border:0;background:none;border-bottom:1px solid #aebbb3;font-size:11px}
#app{--base:#f6f7f3;--surface:#fff;--ink:#25382f;--muted:#64736a;--accent:#365c49;--accent-soft:#eaf0e9;--line:#dce3dc;--radius:9px;min-height:calc(100dvh - 78px);background:var(--base);color:var(--ink)}
#app[data-theme=agenda]{--base:#f1f5fa;--ink:#24354b;--muted:#65788e;--accent:#315c91;--accent-soft:#edf3fb;--line:#dfe6ef;--radius:7px}
#app[data-theme=mesa]{--base:#eaf0f5;--ink:#263746;--muted:#667988;--accent:#40637d;--accent-soft:#e0e8ef;--line:#d6dfe6;--radius:6px;font-family:'Manrope','Segoe UI',sans-serif}
.app-shell{display:grid;grid-template-columns:226px minmax(0,1fr);max-width:1800px;margin:auto;min-height:calc(100dvh - 78px)}
.navigation{padding:34px 19px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:#f0f3ed}
.brand{display:flex;align-items:center;gap:10px;padding-left:16px;margin-bottom:41px}
.brand .icon{width:27px;height:27px;color:var(--accent);stroke-width:1.6}
.brand span{font-family:'Literata',Georgia,serif;font-size:29px;font-weight:500;letter-spacing:-1.4px;line-height:1}
.navigation nav{display:flex;flex-direction:column;gap:5px}
.nav-link{border:0;background:none;display:flex;align-items:center;gap:13px;padding:12px 16px;border-radius:6px;text-align:left;color:var(--muted);font-size:13px;min-height:45px}
.nav-link:hover{background:var(--accent-soft);color:var(--ink)}
.nav-link.active{background:#e1e9df;color:#294b38;font-weight:600}
.nav-link .icon{width:18px;height:18px}
.nav-bottom{margin-top:auto;padding:50px 12px 0}
.plan-note{display:flex;flex-direction:column;gap:7px;margin-bottom:34px;padding-bottom:23px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.plan-note strong{font-size:12px;font-weight:600;color:var(--ink);line-height:1.6}
.profile{display:flex;gap:10px;align-items:center}
.avatar{display:flex;align-items:center;justify-content:center;width:33px;height:33px;border-radius:50%;background:#dfe6de;color:#3f5544;font-size:10px;font-weight:600;flex-shrink:0}
.profile>div{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.profile strong{font-size:11px;font-weight:600}
.profile>div>span{font-size:10px;color:var(--muted)}
.workspace{padding:0 38px;min-width:0;display:flex;flex-direction:column}
.workspace-top{min-height:69px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);gap:14px}
.workspace-top>div{display:flex;align-items:center;gap:18px}
.workspace-top .icon-button{width:30px;height:30px}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:22px;margin:32px 0 28px}
.page-heading h1{font-family:'Literata',Georgia,serif;font-size:32px;font-weight:500;letter-spacing:-1px;line-height:1.3}
.page-heading p{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.7}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;min-height:40px;font-size:12px;font-weight:500;border-radius:5px;white-space:nowrap;border:1px solid transparent;text-decoration:none;line-height:1.4}
.button .icon{width:16px;height:16px}
.button-primary{background:var(--accent);color:white;border-color:var(--accent)}
.button-primary:hover{filter:brightness(1.08)}
.button-outline{border-color:var(--line);background:var(--surface);color:var(--ink)}
.button-outline:hover{border-color:var(--accent)}
.button-small{padding:6px 14px;min-height:32px}
.text-button{background:transparent;border:0;color:var(--accent);padding:6px 0;display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:600;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;white-space:nowrap}
.text-button:hover{text-decoration-color:currentColor}
.text-button .icon{width:15px;height:15px}
.icon-button{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:5px;width:36px;height:36px;color:var(--muted)}
.icon-button:hover{background:var(--accent-soft);color:var(--ink)}
.icon-button .icon{width:18px;height:18px}
.subtle{color:var(--muted);font-size:12px;line-height:1.7}
.section{margin-top:28px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.section-title h2,.weekly-summary h2,.study-aside h2{font-size:14px;font-weight:600;letter-spacing:-.2px}
.section-title>span{font-size:10px;color:var(--muted)}
.section-label{font-size:11px;font-weight:500;color:var(--accent)}
.library-columns{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:36px}
.next-study{position:relative;background:#e9efe5;border:1px solid #d9e3d3;border-radius:var(--radius);padding:24px 26px 23px;overflow:hidden}
.next-study-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#4f6b57;margin-bottom:24px}
.next-study-top>span:last-child{display:flex;align-items:center;gap:6px}
.next-study-top .icon{width:13px;height:13px}
.subject-kicker{font-size:11px;font-weight:500;color:#536c58}
.next-study h2{font-family:'Literata',Georgia,serif;font-size:29px;font-weight:500;letter-spacing:-.7px;margin:6px 0 10px;line-height:1.3;position:relative;z-index:1}
.next-study>p:last-of-type{font-size:11px;color:#596b59;max-width:360px;line-height:1.8}
.next-study-bottom{margin-top:25px;display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.next-study-bottom>span{font-size:10px;color:#657960}
.book-tab{position:absolute;right:31px;top:-1px;height:65px;width:31px;background:#9eaf91;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);opacity:.55}
.next-study-top>span:last-child{margin-right:47px}
.task-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);min-width:0}
.task-row:first-of-type{border-top:1px solid var(--line)}
.task-check{width:21px;height:21px;border:1px solid #bac8bd;border-radius:4px;background:none;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:var(--muted)}
.task-check .icon{width:14px;height:14px}
.task-check.checked{color:white;background:var(--accent);border-color:var(--accent)}
.task-row.completed .task-text strong{text-decoration:line-through;color:var(--muted)}
.task-text{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.task-text>span{font-size:10px;color:var(--muted)}
.task-text strong{font-size:13px;font-weight:500;line-height:1.5}
.task-text small{font-size:10px;color:var(--muted)}
.duration{font-size:11px;color:var(--muted);white-space:nowrap}
.task-start{border:1px solid var(--line);width:31px;height:31px;background:white;margin-left:6px}
.task-start .icon{width:13px;height:13px}
.subject-row{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 0;display:flex;align-items:center;gap:15px;text-align:left}
.subject-row:hover{background:#e9eee545}
.subject-spine{height:33px;width:5px;background:#748b76;border-radius:1px;flex-shrink:0}
.spine-1{background:#9a9879}.spine-2{background:#9baa9b}.spine-3{background:#bec5ac}
.subject-name{font-size:12px;flex:1;min-width:125px}
.subject-name small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.progress-track{height:4px;background:var(--line);border-radius:3px;overflow:hidden;display:block}
.progress-track>span{height:100%;background:var(--accent);display:block;border-radius:3px}
.subject-row>.progress-track{width:68px;flex-shrink:0}
.accuracy{font-size:12px;text-align:right;min-width:50px}
.accuracy small{font-size:9px;color:var(--muted);display:block}
.subject-row>.icon{width:13px;color:var(--muted)}
.study-aside{padding-left:26px;border-left:1px solid var(--line)}
.mini-calendar{padding-top:3px}
.mini-calendar .section-title{margin-bottom:20px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;text-align:center;font-size:10px}
.weekday{color:var(--muted);height:23px;font-size:9px}
.date{display:flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:50%;justify-self:center;position:relative}
.date.selected{background:var(--accent);color:white}
.date.studied:after{content:'';width:3px;height:3px;border-radius:50%;background:#7e967e;position:absolute;bottom:1px;left:11px}
.calendar-key{font-size:9px;color:var(--muted);margin-top:18px;display:flex;align-items:center;gap:5px}
.calendar-key i{width:4px;height:4px;border-radius:50%;background:#7e967e}
.weekly-summary{border-top:1px solid var(--line);padding-top:23px;margin-top:28px}
.weekly-summary .section-title{gap:5px}
.weekly-summary .text-button{font-size:10px}
.week-bars{height:110px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 3px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.week-bars>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:9px;flex:1}
.week-bars .bar{width:15px;background:#c8d3c5;border-radius:3px 3px 0 0;display:block}
.week-bars .bar.current{background:var(--accent)}
.week-bars small{font-size:9px;color:var(--muted);padding-bottom:9px}
.week-total{display:flex;flex-direction:column;gap:3px;margin-bottom:14px}
.week-total strong{font-size:22px;font-weight:500;letter-spacing:-.7px}
.week-total>span{font-size:10px;color:var(--muted)}
.exam-note{display:flex;gap:11px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.exam-note>.icon{width:20px;color:var(--muted);margin-top:1px}
.exam-note h2{font-size:12px}.exam-note p{font-size:10px;color:var(--muted);margin:5px 0}
.workspace-footer{margin-top:auto;display:flex;justify-content:space-between;gap:15px;padding:38px 0 22px;font-size:9px;color:var(--muted)}
.workspace-footer>span:first-child{font-family:'Literata',Georgia,serif;font-size:11px}

/* A agenda muda o eixo de navegação e a composição. */
.horizontal{display:block}
.horizontal .navigation{height:82px;padding:0 40px;flex-direction:row;align-items:center;justify-content:space-between;background:white;border-right:0;border-bottom:1px solid var(--line);gap:35px}
.horizontal .brand{margin:0;padding:0}
.horizontal .brand span{font-family:'Public Sans','Segoe UI',sans-serif;font-size:26px;font-weight:600;letter-spacing:-1.5px}
.horizontal .navigation nav{flex-direction:row;align-self:stretch;gap:18px;flex:1;justify-content:center}
.horizontal .nav-link{border-radius:0;padding:0 5px;border-bottom:2px solid transparent;color:#6b7989;font-size:12px;gap:8px}
.horizontal .nav-link.active{background:transparent;color:var(--accent);border-bottom-color:var(--accent)}
.horizontal .nav-link:hover{background:transparent;color:var(--accent)}
.horizontal .nav-link .icon{width:16px;height:16px}
.horizontal .nav-bottom{padding:0;margin:0}
.horizontal .avatar{background:#e6edf5;color:var(--accent)}
.horizontal .profile strong{font-size:11px}
.horizontal .workspace{max-width:1450px;margin:auto;padding:0 40px}
.horizontal .workspace-top{border:0;min-height:54px}
.horizontal .page-heading{margin-top:12px;margin-bottom:29px}
.horizontal .page-heading h1{font-family:'Public Sans','Segoe UI',sans-serif;font-size:29px;font-weight:600;letter-spacing:-1.1px}
.agenda-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
.agenda-toolbar>div{display:flex;align-items:center;gap:14px}
.agenda-toolbar h2{font-size:15px;font-weight:600;min-width:180px;text-align:center}
.agenda-toolbar .icon-button{background:white;border:1px solid var(--line);width:29px;height:29px}
.agenda-toolbar .icon-button .icon{width:14px;height:14px}
.agenda-columns{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:25px}
.week-calendar{background:white;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.week-day-labels{display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);padding:14px 0 10px}
.time-header{font-size:8px;color:var(--muted);align-self:end;padding:0 4px 5px 7px}
.day-heading{border:0;background:transparent;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:10px;color:var(--muted);min-height:55px}
.day-heading strong{font-size:15px;font-weight:500;width:29px;height:29px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink)}
.day-heading.active strong{background:var(--accent);color:white}
.day-heading.active{color:var(--accent)}
.week-grid{height:435px;display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr));padding-bottom:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 71.5px,#e9eef4 71.5px,#e9eef4 72.5px)}
.time-axis{display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:4px 0 55px 9px;background:white}
.time-axis span{font-size:8px;color:#7a8ba0}
.day-column{position:relative;border-left:1px solid #edf1f6;min-width:0}
.day-column.selected-day{background:#edf3fb55}
.calendar-event{position:absolute;left:3px;right:3px;border:0;border-left:2px solid #6486b1;border-radius:3px;background:#e8eff9;padding:7px 5px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;color:#2c537f;min-height:64px;line-height:1.4}
.calendar-event:hover{background:#dbe7f6}
.calendar-event.new-content{background:#f8eddc;color:#895c24;border-left-color:#b18a51}
.calendar-event time{font-size:8px;opacity:.85}
.calendar-event strong{font-size:9px;font-weight:600;overflow-wrap:anywhere}
.calendar-event>span{font-size:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.calendar-footer{display:flex;align-items:center;gap:19px;border-top:1px solid var(--line);padding:13px 18px;font-size:9px;color:var(--muted)}
.calendar-footer>span{display:flex;align-items:center;gap:6px}
.calendar-footer>span:last-child{margin-left:auto;font-size:8px}
.calendar-footer i{width:7px;height:7px;border-radius:2px;background:#8ba5c9}
.calendar-footer .legend-new{background:#c4a36d}
.agenda-aside{background:white;padding:23px 20px;border:1px solid var(--line);border-radius:var(--radius)}
.agenda-aside>h2{font-size:17px;font-weight:500;letter-spacing:-.4px}
.agenda-aside>.subtle{font-size:10px;margin-top:4px}
.day-sessions{margin:19px 0 28px;display:flex;flex-direction:column;gap:18px}
.day-sessions>button{position:relative;padding:0 0 0 16px;display:flex;flex-direction:column;gap:5px;border:0;border-left:2px solid #b6c9e0;background:none;text-align:left}
.day-sessions>button:hover{border-left-color:var(--accent)}
.day-sessions time{font-size:10px;color:var(--accent)}
.day-sessions strong{font-size:12px;font-weight:600;line-height:1.5}
.day-sessions span{font-size:10px;color:var(--muted)}
.day-sessions small{font-size:9px;color:var(--muted)}
.agenda-aside .week-total{border-top:1px solid var(--line);padding-top:20px}
.agenda-aside>.progress-track{margin-bottom:11px}
.agenda-bottom{margin-top:22px;display:flex;align-items:center;gap:30px;padding:21px 23px;background:white;border:1px solid var(--line);border-radius:var(--radius)}
.agenda-bottom h2{font-size:13px}.agenda-bottom p{font-size:11px;color:var(--muted);margin-top:5px}
.agenda-bottom>.progress-track{flex:1;max-width:250px;margin-left:auto}
.agenda-mobile-list{display:none}
.empty-note{padding:20px;font-size:12px;color:var(--muted);line-height:1.8}

/* A Mesa concentra a identidade na área de trabalho da sessão. */
[data-theme=mesa] .app-shell{grid-template-columns:194px minmax(0,1fr)}
[data-theme=mesa] .navigation{background:#243549;color:#dce5ed;border:0;padding:34px 13px 23px}
[data-theme=mesa] .brand span{font-family:'Manrope','Segoe UI',sans-serif;font-size:27px;font-weight:600;letter-spacing:-1.3px}
[data-theme=mesa] .brand .icon{color:#d2ac6f}
[data-theme=mesa] .nav-link{color:#a8bacb;font-size:12px;padding:12px 13px;gap:12px}
[data-theme=mesa] .nav-link.active{background:#35495f;color:#fff}
[data-theme=mesa] .nav-link:hover{background:#2e4359;color:#fff}
[data-theme=mesa] .nav-bottom{padding-left:11px;padding-right:5px}
[data-theme=mesa] .plan-note{border-color:#405063;color:#a6b6c6}
[data-theme=mesa] .plan-note strong{color:#edf2f7}
[data-theme=mesa] .avatar{background:#3a4e63;color:#eddfc9}
[data-theme=mesa] .profile>div>span{color:#a6b6c6}
[data-theme=mesa] .page-heading h1{font-family:'Manrope','Segoe UI',sans-serif;font-size:29px;letter-spacing:-1px;font-weight:600}
[data-theme=mesa] .workspace{padding:0 38px}
.focus-date{font-size:11px;color:var(--muted);border:1px solid #d1dce4;padding:9px 12px;border-radius:4px}
.desk-columns{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:23px}
.focus-workspace{background:#243549;color:#f5f7fa;border-radius:7px;padding:25px 30px 0;overflow:hidden}
.focus-topic{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:10px;color:#b5c5d3;margin-bottom:31px}
.focus-topic>span:first-child{display:flex;align-items:center;gap:7px}
.focus-topic .icon{width:16px;height:16px}
.focus-marker{font-size:9px;color:#dfc394;border-bottom:1px solid #8b795d;padding-bottom:3px}
.focus-workspace h2{font-size:28px;font-weight:500;letter-spacing:-1.1px;line-height:1.35}
.focus-workspace>p{color:#adbfce;font-size:11px;margin-top:8px}
.timer-zone{margin:30px 0 24px}
.timer-zone>p{font-size:10px;color:#a9bbcc;margin-bottom:2px}
.timer-value{font-variant-numeric:tabular-nums;letter-spacing:-5px;font-weight:400;font-size:76px;line-height:1.35}
.duration-options{display:flex;gap:6px;margin-top:9px}
.duration-options>button{background:transparent;border:1px solid #536476;color:#bdccd9;font-size:10px;padding:5px 12px;border-radius:3px;min-height:28px}
.duration-options>button[aria-pressed=true]{background:#45586d;color:#fff;border-color:#657589}
.focus-controls{display:flex;gap:9px;margin-bottom:31px}
.button-focus{background:#d2ac6f;color:#263344;min-width:145px;font-weight:600}
.button-focus:hover{background:#e0bc84}
.button-on-dark{background:transparent;color:#dce5ed;border-color:#5b6b7c}
.focus-footnote{margin:0 -30px;padding:15px 30px;border-top:1px solid #425064;color:#a8bacb;display:flex;justify-content:space-between;gap:15px;font-size:9px}
.desk-queue{background:#f8fafc;border:1px solid var(--line);border-radius:7px;padding:22px 19px 20px}
.desk-queue .section-title{margin-bottom:12px}
.desk-queue .section-title h2{font-size:13px}.desk-queue .section-title>span{font-size:9px}
.queue-item{padding:16px 0;display:flex;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.queue-number{margin-top:4px;font-size:10px;font-weight:500;width:19px;height:19px;border:1px solid #cbd7e0;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#718598;flex-shrink:0}
.queue-number .icon{width:12px;height:12px}
.queue-item.selected .queue-number{background:#dce5ec;border-color:#8aa1b4;color:#365369}
.queue-item>div{display:flex;flex-direction:column;gap:5px}
.queue-item small{font-size:9px;color:var(--muted)}
.queue-item strong{font-size:11px;font-weight:600;line-height:1.6}
.queue-item>div>span{font-size:9px;color:var(--muted)}
.queue-item.selected strong{color:var(--accent)}
.desk-plan{padding-top:20px}
.desk-plan h3{font-size:10px;color:var(--muted);font-weight:500}
.desk-plan>div{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;font-size:11px}
.desk-plan strong{font-size:19px;font-weight:500;letter-spacing:-.4px}
.desk-plan strong>span{font-size:10px;font-weight:400;color:var(--muted);letter-spacing:0}
.desk-plan>.text-button{margin-top:8px;font-size:10px}
.recent-sessions{padding:20px 23px;border-radius:7px;background:#f8fafc;border:1px solid var(--line);margin-top:24px}
.recent-sessions .section-title h2{font-size:13px}
.recent-sessions table th{font-size:9px}
.recent-sessions table td{font-size:10px;padding:13px 10px}
.recent-sessions table td>strong{font-size:11px}
.recent-sessions table td>span{font-size:9px}

/* Páginas de avaliação comuns, com os tokens de cada proposta. */
.active-notice{display:flex;gap:24px;align-items:center;padding:27px;background:white;border:1px solid var(--line);border-radius:var(--radius);border-top:3px solid var(--accent)}
.notice-file{display:flex;align-items:center;justify-content:center;width:58px;height:74px;background:var(--accent-soft);border:1px solid var(--line);border-radius:3px;flex-shrink:0;color:var(--accent)}
.notice-file .icon{width:28px;height:28px;stroke-width:1.2}
.status-label{font-size:9px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:4px 7px;white-space:nowrap;display:inline-block}
.status-neutral{background:#edf0f0;color:#66736f}
.status-due{background:#f3eadc;color:#89672e}
.active-notice h2{font-size:20px;letter-spacing:-.6px;margin:9px 0 6px}
.active-notice p{font-size:11px;color:var(--muted)}
.active-notice p.subtle{font-size:10px;margin-top:7px}
.notice-progress{margin-left:auto;width:140px;flex-shrink:0;font-size:11px}
.notice-progress>.progress-track{margin:10px 0 9px}
.notice-progress>span:last-child{font-size:10px;color:var(--muted)}
.notice-row{display:flex;align-items:center;gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}
.notice-row>div{display:flex;align-items:center;gap:17px;flex:1}
.notice-row>div>.icon{width:24px;height:24px;color:var(--muted)}
.notice-row h3{font-size:14px;font-weight:500;margin-bottom:7px}
.notice-row p{font-size:11px;color:var(--muted)}
.help-note{display:flex;gap:12px;align-items:start;font-size:11px;color:var(--muted);line-height:1.8;margin-top:26px;max-width:650px}
.help-note>.icon{margin-top:2px;width:17px;height:17px}
.topic-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:21px;flex-wrap:wrap}
.search-field{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:5px;min-width:230px;max-width:360px;flex:1;padding:0 13px}
.search-field .icon{width:16px;height:16px;color:var(--muted)}
.search-field input{border:0;background:none;font-size:11px;padding:12px 0;min-width:0;width:100%;color:var(--ink)}
.search-field:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.search-field input:focus-visible{outline:0}
.select-field{display:flex;align-items:center;gap:9px;font-size:10px;color:var(--muted)}
.select-field select{padding:10px 27px 10px 10px;border:1px solid var(--line);border-radius:4px;background:white;color:var(--ink);font-size:11px}
.topic-count{font-size:10px;color:var(--muted);margin-left:auto}
.topic-summary{display:flex;align-items:center;gap:35px;font-size:10px;color:var(--muted);margin-bottom:24px}
.topic-summary strong{font-size:16px;font-weight:500;margin-right:4px;color:var(--ink)}
.table-surface{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:white}
.table-scroll{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:11px}
th{padding:15px 17px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);font-weight:500;white-space:nowrap}
td{padding:17px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:11px}
tr:last-child td{border-bottom:0}
td>strong{display:block;font-size:12px;font-weight:500;white-space:nowrap}
td>span:not(.status-label){display:block;color:var(--muted);font-size:10px;margin-top:5px}
.topics-table td:nth-child(n+2){white-space:nowrap}
.topics-table td:first-child{width:35%}
.admin-columns{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:35px;align-items:start}
.form-surface{padding:25px;background:white;border:1px solid var(--line);border-radius:var(--radius)}
.form-surface h2{font-size:16px;margin-bottom:9px;letter-spacing:-.3px}
.form-surface>.subtle{font-size:11px}
form{display:flex;flex-direction:column;gap:21px}
.form-surface form{margin-top:25px}
form label{display:flex;flex-direction:column;gap:8px;font-size:11px;font-weight:500}
form input,form select,textarea{padding:11px;border-radius:4px;border:1px solid var(--line,#dce3dc);background:#fff;color:var(--ink,#25382f);width:100%;font-size:12px;font-weight:400}
form input::placeholder{color:#819087}
form input[type=file]{font-size:10px}
.form-note{font-size:10px;color:var(--muted,#68786d);line-height:1.8}
.user-list{padding-top:6px}
.user-list .section-title{padding-bottom:14px;border-bottom:1px solid var(--line)}
.user-row{display:flex;align-items:center;gap:13px;padding:19px 0;border-bottom:1px solid var(--line)}
.user-row>.avatar{background:var(--accent-soft);color:var(--accent);width:36px;height:36px}
.user-row>div{flex:1;min-width:0}
.user-row strong{font-size:12px;font-weight:500;overflow-wrap:anywhere}
.user-row>div>span{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.user-row>.icon{width:16px;height:16px;color:var(--accent)}
.settings-form{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
.settings-form>button{justify-self:start}
.availability{display:flex;flex-direction:column;gap:15px;margin-top:25px}
.availability>label{display:grid;grid-template-columns:minmax(90px,1fr) 70px 40px;align-items:center;font-size:12px;font-weight:400;gap:14px}
.availability>label input{padding:8px;font-size:12px;text-align:center}
.availability>label>span{font-size:10px;color:var(--muted)}
.settings-goals{display:flex;flex-direction:column;gap:20px}
.settings-goals h2{margin-bottom:4px}
.settings-goals .subtle{font-size:10px}
.form-pair{display:grid;grid-template-columns:1fr 1fr;gap:15px}

/* Janelas e retornos de ações de demonstração. */
dialog{border:1px solid #d8dfda;border-radius:10px;max-width:calc(100vw - 32px);width:460px;max-height:90dvh;padding:0;color:#25382f;background:#fff;box-shadow:0 20px 75px #152d282b}
dialog::backdrop{background:#172b3666;backdrop-filter:blur(3px)}
#dialog-content{padding:34px;position:relative}
.dialog-close{position:absolute;right:12px;top:12px}
dialog h2{font-family:'Literata',Georgia,serif;font-size:25px;font-weight:500;letter-spacing:-.6px;line-height:1.4;padding-right:16px;margin-bottom:14px}
dialog h3{font-size:14px;font-weight:600;margin-bottom:9px}
dialog p{font-size:12px;line-height:1.8;color:#61746a;margin-bottom:16px}
dialog .section-label{display:block;font-size:10px;color:#647869;margin-bottom:9px}
dialog .button{--accent:#365c49;--line:#dce3dc;--ink:#25382f;--surface:#fff}
dialog .text-button{color:#365c49}
dialog form{margin-top:24px}
dialog textarea{font-family:'Public Sans','Segoe UI',sans-serif;resize:vertical;font-size:11px;line-height:1.7;margin-bottom:18px;background:#f7f9f6}
.dialog-timer{font-family:'Manrope','Segoe UI',sans-serif;font-size:65px;letter-spacing:-3px;text-align:center;margin:24px 0;color:#2c483a}
.dialog-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
dialog .form-note{font-size:10px;margin-top:15px;margin-bottom:0}
.about-dialog{width:620px}
.concept-list{display:flex;flex-direction:column;gap:20px;margin:25px 0}
.concept-list article{border-top:1px solid #dde3de;padding-top:20px}
.concept-list article p{font-size:12px;margin:0 0 7px;max-width:65ch}
.reminder-list{border-top:1px solid #dde3de;margin:20px 0}
.reminder-list p{padding:15px 0;margin:0;border-bottom:1px solid #dde3de}
.reminder-list p>strong{display:block;font-size:12px;color:#2e4436}
.reminder-list p>span{font-size:10px}
#toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,18px);opacity:0;pointer-events:none;z-index:10;padding:12px 19px;background:#253b30;color:white;border-radius:6px;box-shadow:0 4px 20px #152a2922;font-size:12px;max-width:calc(100vw - 32px);width:max-content;transition:opacity .15s,transform .15s;text-align:center}
#toast.visible{opacity:1;transform:translate(-50%,0)}

/* Mesa ampliada: atividade, calendário, metas e cronograma. */
.desk-shortcuts{display:flex;align-items:center;gap:24px;margin:-7px 0 25px;padding:0 0 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.desk-shortcuts a{font-size:11px;color:var(--muted);text-decoration:none;padding:5px 0;text-underline-offset:5px}
.desk-shortcuts a:first-child{color:var(--accent);font-weight:600}
.desk-shortcuts a:hover{color:var(--ink);text-decoration:underline}
.desk-section,.section-anchor,#historico{scroll-margin-top:24px}
.desk-section{margin-top:25px;background:#f8fafc;border:1px solid var(--line);border-radius:7px;padding:25px;min-width:0}
.desk-section-heading{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:23px}
.desk-section-heading h2{font-size:16px;font-weight:600;letter-spacing:-.35px}
.desk-section-heading p{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7}
.activity-period select{padding:8px 29px 8px 11px;background:white;border:1px solid var(--line);border-radius:4px;font-size:11px;color:var(--ink);max-width:220px}
.activity-scroll{overflow-x:auto;padding:1px 1px 7px}
.activity-chart{--cell:clamp(10px,calc((100vw - 580px)/53),15px);display:grid;grid-template-columns:29px max-content;grid-template-rows:24px auto;width:max-content}
.activity-months{grid-column:2;display:grid;grid-template-columns:repeat(var(--weeks),var(--cell));gap:4px;font-size:9px;color:var(--muted)}
.activity-day-labels{display:grid;grid-template-rows:repeat(7,var(--cell));gap:4px;font-size:8px;color:var(--muted);align-items:center}
.activity-cells{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--cell));grid-template-columns:repeat(var(--weeks),var(--cell));gap:4px}
.activity-cell{border:1px solid #cbd5de55;border-radius:2px;padding:0;background:#e6ecf1;width:var(--cell);height:var(--cell)}
.level-0{background:#e6ecf1}.level-1{background:#bbcedd}.level-2{background:#87a8bf}.level-3{background:#527d9d}.level-4{background:#2d536f}
.activity-cell.chosen{outline:2px solid #b38b4b;outline-offset:2px}
.activity-cell.future-day{background:#f0f4f7;border-color:#dce4ea}
.activity-cell:focus-visible{outline:2px solid #263e54;outline-offset:2px}
.activity-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:12px;font-size:10px;color:var(--muted)}
.activity-footer strong{font-weight:600;color:var(--ink)}
.activity-legend{display:flex;align-items:center;gap:4px;font-size:9px;white-space:nowrap}
.activity-legend i{height:11px;width:11px;border-radius:2px;display:block}
.activity-legend>span:first-child{margin-right:4px}.activity-legend>span:last-child{margin-left:4px}
.activity-hint{display:none}
.desk-calendar-columns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr);gap:24px}
.calendar-mode{display:flex;gap:2px;background:#e9eef3;padding:3px;border-radius:5px}
.calendar-mode>button{border:0;border-radius:3px;background:transparent;font-size:10px;color:var(--muted);padding:5px 11px;min-height:27px}
.calendar-mode>button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #233d5112}
.full-calendar-toolbar{display:flex;align-items:center;gap:8px;margin:0 0 18px}
.full-calendar-toolbar h3{font-size:13px;font-weight:500;text-transform:capitalize;min-width:150px;text-align:center}
.full-calendar-toolbar .icon-button{border:1px solid var(--line);background:white;width:29px;height:29px}
.full-calendar-toolbar .icon-button .icon{width:14px;height:14px}
.full-calendar-toolbar .text-button{margin-left:auto;font-size:10px}
.full-weekdays,.full-month-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.full-weekdays{padding-bottom:12px;font-size:10px;text-align:center;color:var(--muted)}
.full-month-days{row-gap:7px}
.full-date{height:43px;border:1px solid transparent;background:transparent;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:12px;position:relative}
.full-date:hover{background:#e5edf3}.full-date.today{border-color:#9fb4c5;color:#325471;font-weight:600}
.full-date.selected{background:#40637d;color:#fff;border-color:#40637d}
.full-date.off-month{color:#a6b5c1}
.full-date.selected.off-month{color:white}

document.addEventListener('click', event => {
  const target = event.target.closest('button')
  if (!target) return
  if (target.dataset.layout) { state.layout=target.dataset.layout; if(dialog.open)dialog.close(); render(); return }
  if (target.dataset.screen) { state.screen=target.dataset.screen; render(); $('#workspace').focus({preventScroll:true}); window.scrollTo({top:0}); return }
  if (target.dataset.boardTopic) { state.selected=Number(target.dataset.boardTask);state.boardTopic=target.dataset.boardTopic;state.activeBoardId=target.dataset.boardId;state.running=false;state.seconds=tasks[state.selected].duration*60;focusDialog();return }
  if (target.dataset.activityDate) { const date=dateFromKey(target.dataset.activityDate);state.selectedDate=target.dataset.activityDate;state.calendarYear=date.getFullYear();state.calendarMonth=date.getMonth();state.calendarMode='month';const scroll=window.scrollY;render();window.scrollTo({top:scroll});return }
  if (target.dataset.calendarDate) { state.selectedDate=target.dataset.calendarDate;render();return }
  if (target.dataset.calendarMonth!==undefined) { state.calendarMonth=Number(target.dataset.calendarMonth);state.calendarMode='month';render();return }
  if (target.dataset.calendarMode) { state.calendarMode=target.dataset.calendarMode;render();return }
  if (target.dataset.complete !== undefined) { const index=Number(target.dataset.complete); state.completed.has(index)?state.completed.delete(index):state.completed.add(index); render(); return }
  if (target.dataset.study !== undefined) { state.boardTopic='';state.activeBoardId=null;state.selected=Number(target.dataset.study); state.seconds=tasks[state.selected].duration*60; state.running=false; focusDialog(); return }
  if (target.dataset.select !== undefined) { state.boardTopic='';state.activeBoardId=null;state.selected=Number(target.dataset.select); state.seconds=tasks[state.selected].duration*60; state.running=false; render(); return }
  if (target.dataset.subject !== undefined) { state.subject=subjects[Number(target.dataset.subject)].name; state.screen='topicos'; render(); return }
  if (target.dataset.day !== undefined) { state.day=Number(target.dataset.day); render(); return }
  if (target.dataset.duration) { state.seconds=Number(target.dataset.duration)*60; state.running=false; render(); return }
  const action=target.dataset.action
  if (action==='close') dialog.close()
  if (action==='calendar-prev'||action==='calendar-next') { const step=action==='calendar-next'?1:-1;if(state.calendarMode==='year')state.calendarYear+=step;else{const date=new Date(state.calendarYear,state.calendarMonth+step,1);state.calendarYear=date.getFullYear();state.calendarMonth=date.getMonth()}render() }
  if (action==='calendar-today') {state.calendarYear=2026;state.calendarMonth=9;state.selectedDate='2026-10-15';state.calendarMode='month';render()}
  if (action==='focus') focusDialog()
  if (action==='toggle-timer') { state.running=!state.running; if(dialog.open)focusDialog(); else render() }
  if (action==='register') registerDialog()
  if (action==='prev-week'||action==='next-week') { state.week+=action==='next-week'?1:-1; render() }
  if (action==='today') { state.week=0;state.day=3;render() }
  if (action==='show-agenda') { state.layout='agenda';render() }
  if (action==='notifications') showDialog(`<h2>Seus lembretes</h2><p>Há 3 revisões previstas para hoje.</p><div class="reminder-list">${tasks.filter(task=>task.type!=='Conteúdo novo').map(task=>`<p><strong>${task.topic}</strong><span>${task.subject}</span></p>`).join('')}</div>${button('Ver tópicos','open-topics','button button-primary')}`)
  if (action==='open-topics'||action==='review-notice') { dialog.close();state.screen='topicos';state.subject='';render() }
  if (action==='archive-notice') showDialog(`<h2>Técnico judiciário</h2><p>Plano arquivado, com 42 tópicos estudados e 18 sessões registradas.</p><p class="subtle">O histórico continua disponível. Esta é uma amostra visual do arquivo.</p>`)
  if (action==='import') showDialog(`<h2>Importar edital</h2><p class="subtle">Prévia do formulário. O arquivo não será enviado a nenhum servidor.</p><form id="import-form"><label>Nome do plano<input name="title" required placeholder="Ex.: Técnico administrativo"></label><label>Arquivo PDF<input name="file" type="file" accept="application/pdf"></label><button type="submit" class="button button-primary">Visualizar próximo passo</button></form>`)
  if (action==='copy-invitation') {
    navigator.clipboard.writeText(state.invitation).then(()=>toast('Mensagem copiada. Este acesso é fictício.')).catch(()=>toast('Selecione a mensagem e copie manualmente.'))
  }
})

document.addEventListener('change',event=>{
  if(event.target.id==='subject-filter'){state.subject=event.target.value;$('#topic-rows').innerHTML=topicTableRows();$('#topic-count').textContent=`${filteredTopics().length} tópicos na amostra`}
  if(event.target.id==='activity-year'){state.activityYear=event.target.value;if(state.activityYear==='2025')state.selectedDate='2025-12-31';render()}
  if(event.target.id==='board-subject'){state.boardSubject=event.target.value;render()}
})
document.addEventListener('keydown',event=>{
  if(!event.target.matches('.activity-cell'))return
  const delta={ArrowUp:-1,ArrowDown:1,ArrowLeft:-7,ArrowRight:7}[event.key]
  if(delta===undefined)return
  event.preventDefault();const cells=Array.from(document.querySelectorAll('.activity-cell')),index=cells.indexOf(event.target),next=cells[index+delta]
  if(next){event.target.tabIndex=-1;next.tabIndex=0;next.focus()}
})
document.addEventListener('submit',event=>{
  event.preventDefault()
  const data=new FormData(event.target)
  if(event.target.id==='session-form') { if(state.activeBoardId)state.boardCompleted.add(state.activeBoardId);if(!state.activeBoardId||state.boardTopic===tasks[state.selected].topic)state.completed.add(state.selected);state.running=false;dialog.close();render();toast(`${data.get('minutes')} minutos registrados na demonstração.`) }
  if(event.target.id==='settings-form') toast('Rotina atualizada apenas nesta demonstração.')
  if(event.target.id==='import-form') showDialog(`<h2>Revisar conteúdo extraído</h2><p><strong>${escapeHtml(data.get('title'))}</strong></p><p class="subtle">Na aplicação, esta etapa permite conferir as matérias e os tópicos antes de ativar o plano.</p>${button('Ver exemplo de tópicos','open-topics','button button-primary')}`)
  if(event.target.id==='user-form') {
    const email=String(data.get('email')).trim().toLowerCase()
    if(state.users.some(user=>user.email===email)){toast('Este e-mail já está na lista de demonstração.');return}
    state.users.push({email,role:'Aguardando troca de senha'})
    const random=crypto.getRandomValues(new Uint8Array(8));const password=Array.from(random,byte=>byte.toString(16).padStart(2,'0')).join('')+'Aa1!'
    state.invitation=`Exemplo de mensagem, sem acesso real.\n\nOlá! Sua conta no Studia está pronta.\nAcesso: https://studia.exemplo/entrar\nLogin: ${email}\nSenha temporária: ${password}\n\nNo primeiro acesso, escolha uma nova senha.`
    render();showDialog(`<h2>Mensagem de acesso</h2><p class="subtle">Exemplo para copiar e enviar. Nenhuma conta real foi criada.</p><textarea readonly rows="9" aria-label="Mensagem de acesso fictícia">${escapeHtml(state.invitation)}</textarea>${button('Copiar mensagem','copy-invitation','button button-primary','copy')}`)
  }
})
setInterval(()=>{
  if(!state.running)return
  if(state.seconds>0)state.seconds--
  document.querySelectorAll('.timer-value').forEach(element=>element.textContent=timerText())
  if(state.seconds===0){state.running=false;toast('Tempo de foco concluído. Registre seu estudo.');if(dialog.open)focusDialog();else render()}
},1000)
render()

</script>
</body>
</html>
