server {
    listen 80;
    server_name _;
    client_max_body_size 16m;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css font/ttf;

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /api {
        try_files $uri $uri/ @codeigniter;
    }

    location @codeigniter {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/server/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_read_timeout 630s;
        fastcgi_intercept_errors on;
        error_page 500 502 503 504 = @api_unavailable;
        fastcgi_pass php:9000;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"O serviço está temporariamente indisponível. Tente novamente em alguns instantes."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
